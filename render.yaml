# Render Blueprint for a synthetic/demo deployment using the API's SQLite default.
# Render's free web filesystem is ephemeral, so demo transactions can reset on restart.
services:
  - type: web
    name: financial-intelligence-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    envVars:
      - key: CORS_ORIGINS
        value: https://financial-intelligence-web.onrender.com
      - key: AUTH_REQUIRED
        value: "true"
      - key: API_KEY_ANALYST
        sync: false
      - key: API_KEY_OPERATOR
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: SANDBOX_PARTNER_ID
        value: render-sandbox-partner

  - type: web
    name: financial-intelligence-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://financial-intelligence-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://financial-intelligence-api.onrender.com/ws/transactions
